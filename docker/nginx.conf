# Guest share API: throttle per real client IP. Cloudflare's tunnel sets
# CF-Connecting-IP; on the LAN the header is absent and an empty key means
# no limit, which is what we want there.
limit_req_zone $http_cf_connecting_ip zone=publicapi:1m rate=20r/s;

map $request_method $resources_backend {
    default 127.0.0.1:30334;
    POST    127.0.0.1:9190;
    PATCH   127.0.0.1:9190;
    DELETE  127.0.0.1:9190;
}

server {
    listen 8090;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        # Guest share pages (/s/<hash>) resolve here via the SPA fallback's
        # internal redirect, not through `location /` — put the noindex
        # header where it will actually be sent for those responses.
        add_header X-Robots-Tag "noindex" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /api/resources {
        proxy_pass http://$resources_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 0;
        proxy_request_buffering off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:30334/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 0;
        proxy_request_buffering off;
    }

    # Guest share links: only FBQ's hash-keyed public API is exposed. FBQ's
    # own guest UI (/public/share/, /public/static/) stays LAN-only.
    location /public/api/ {
        limit_req zone=publicapi burst=60 nodelay;
        proxy_pass http://127.0.0.1:30334/public/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 1m;
    }

    location /nasapi/ {
        proxy_pass http://127.0.0.1:9190/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex" always;
    }
}
